
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro React</title>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        function Cabecalho() {
            return (
                <header>
                    <h1>Almoxarifado Inteligente</h1>
                    <p>Sistema digital para organizar e controlar o estoque.</p>
                </header>
            );
        }

        function Cartao() {
            return (
                <div>
                    <h3>Controle de estoque</h3>
                    <p>Organização dos materiais do almoxarifado.</p>
                </div>
            );
        }

        function Lista() {
            const tarefas = [
                { id: 1, texto: "Estudar React" },
                { id: 2, texto: "Levar o cachorro" }
            ];

            return (
                <ul>
                    {tarefas.map((t) => <li key={t.id}>{t.texto}</li>)}
                </ul>
            );
        }

        function App() {
            return (
                <div>
                    <Cabecalho />
                    <Cartao />
                    <Cartao />
                    <Cartao />
                    <h2>Lista de tarefas</h2>
                    <Lista />
                </div>
            );
        }

        const raiz = ReactDOM.createRoot(document.getElementById("root"));
        raiz.render(<App />);
    </script>
</body>
</html>
